server:
  port: ${WEB_API_PORT}

spring:
  application:
    name: web-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 86400000
  refresh-expiration: 432000000

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:14b}

telegram:
  bot-name: ${TELEGRAM_BOT_NAME}
  bot-token: ${TELEGRAM_BOT_TOKEN}
  bot-secret: ${TELEGRAM_BOT_SECRET}
  link-token-expiry-minutes: 15

logging:
  level:
    kz.kbtu.webapi: INFO
